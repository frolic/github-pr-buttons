name: E2E tests

# Demo workflow for the extension's test PR. Its jobs only sleep.

on:
  workflow_dispatch:
    inputs:
      browser:
        description: Browser to run in
        default: chromium

jobs:
  e2e:
    name: E2E (${{ inputs.browser }}, shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Install dependencies
        run: sleep 10
      - name: Build
        run: sleep 15
      - name: Run tests
        run: sleep $((60 + ${{ matrix.shard }} * 20))
