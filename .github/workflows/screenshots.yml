name: Screenshots

# Demo workflow for the extension's test PR. Its jobs only sleep.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to render
        default: macos,windows,linux
      update:
        description: Commit the new screenshots to the branch
        type: boolean
        default: false

jobs:
  render:
    name: Render screenshots
    runs-on: ubuntu-latest
    steps:
      - name: Render ${{ inputs.platforms }}
        run: sleep 240
