name: Test fail

# For trying the extension on this repo's own PRs: one job fails and one
# passes, so "Re-run failed jobs" has something to re-run.

on:
  workflow_dispatch:

jobs:
  passes:
    runs-on: ubuntu-latest
    steps:
      - run: echo ok
  fails:
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
