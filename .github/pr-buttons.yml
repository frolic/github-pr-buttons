# yaml-language-server: $schema=https://raw.githubusercontent.com/frolic/github-pr-buttons/main/schema.json
# Demo buttons for this repo's test PR. The workflows only sleep.

buttons:
  - label: Run integration tests
    workflow: integration-tests.yml
    description: Three shards against real services.
    paths: &app
      - 'src/**'
      - '!**/*.md'
  - label: Update snapshots
    workflow: update-snapshots.yml
    description: Re-records snapshots and commits them to this branch.
    paths: *app
  - label: Deploy to staging
    workflow: deploy-staging.yml
    inputs:
      environment: staging
  - label: Run load test
    workflow: load-test.yml
    paths:
      - 'server/**'
  - label: Check database migrations
    workflow: database-migration-check.yml
    paths:
      - 'migrations/**'
