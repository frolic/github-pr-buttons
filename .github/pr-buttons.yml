# yaml-language-server: $schema=https://raw.githubusercontent.com/frolic/github-pr-buttons/main/schema.json
# Demo buttons for this repo's test PR. The workflows only sleep.

buttons:
  - label: Run e2e tests
    workflow: e2e.yml
    description: Three shards in Chromium.
    paths: &app
      - 'src/**'
      - '!**/*.md'
  - label: Render screenshots
    workflow: screenshots.yml
    description: macOS, Windows and Linux.
    inputs:
      platforms: macos,windows,linux
    paths: *app
  - label: Deploy preview
    workflow: preview.yml
    description: Deploys this branch to a preview URL.
  - label: Run benchmarks
    workflow: benchmarks.yml
    paths:
      - 'bench/**'
  - label: Publish docs
    workflow: docs.yml
    paths:
      - 'docs/**'
