<!doctype html>
<meta charset="utf-8" />
<style>
	body {
		font:
			13px system-ui,
			sans-serif;
		margin: 16px;
		min-width: 360px;
	}
	input {
		width: 100%;
		box-sizing: border-box;
		font: inherit;
		padding: 4px 6px;
	}
	p {
		color: #59636e;
	}
</style>
<label for="token"><strong>GitHub token</strong></label>
<p>
	Fine-grained personal access token with access to the repos you use, and these repository
	permissions: Actions (read and write), Contents (read), Pull requests (read).
</p>
<input id="token" type="password" autocomplete="off" />
<p id="message"></p>
<script src="options.js"></script>
